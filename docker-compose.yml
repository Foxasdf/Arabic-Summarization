services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meeting-summarizer-backend
    ports:
      - "${BACKEND_PORT:-8811}:3011"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./models:/app/models
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    environment:
      - MEETING_HOST=0.0.0.0
      - MEETING_PORT=3011
      - MEETING_MODELS_DIR=/app/models
      - MEETING_UPLOAD_DIR=/app/uploads
      - MEETING_DB_PATH=/app/data/meetings.db
      - MEETING_DIARIZATION_BACKEND=auto
      - HF_TOKEN=REDACTED_HF_TOKEN
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meeting-summarizer-frontend
    ports:
      - "${FRONTEND_PORT:-3011}:80"
    depends_on:
      - backend
    restart: unless-stopped
